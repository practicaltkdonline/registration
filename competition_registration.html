<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>比賽報名系統 - 活力登場</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
    .card-hover {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .card-hover:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15);
    }
    .info-content {
      max-height: 0;
      opacity: 0;
      transition: all 0.4s ease;
      overflow: hidden;
    }
    .expanded .info-content {
      max-height: 520px;
      opacity: 1;
      padding-top: 16px;
    }
    .step {
      white-space: nowrap !important;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .step-active { background: linear-gradient(to right, #1E88E5, #42A5F5); color: white; box-shadow: 0 4px 12px rgba(30,136,229,0.3); }
    .gradient-btn { background: linear-gradient(135deg, #1E88E5, #FF9800); }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 1100; }
    .bottom-bar { display: none; }
    .main-content { padding-bottom: 40px; }
    @media (max-width: 1024px) {
      .desktop-sidebar { display: none; }
      .bottom-bar { display: flex; }
      .main-content { padding-bottom: 140px; }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-orange-500 text-white py-7 px-8 shadow-xl">
      <h1 class="text-3xl font-bold flex items-center gap-3">🏆 比賽報名系統</h1>
      <p class="text-blue-100">選擇賽事 • 展現實力</p>
    </div>

    <!-- Stepper -->
    <div class="bg-white py-6 shadow-sm">
      <div class="flex justify-center gap-6 md:gap-12">
        <div onclick="goToStep(1)" id="step1" class="step px-7 py-3 rounded-2xl font-medium cursor-pointer step-active flex items-center gap-2 text-sm md:text-base">
          <span class="w-7 h-7 bg-white text-blue-600 rounded-full flex items-center justify-center font-bold">1</span>
          選擇賽事
        </div>
        <div onclick="goToStep(2)" id="step2" class="step px-7 py-3 rounded-2xl font-medium cursor-pointer flex items-center gap-2 text-gray-500 hover:text-gray-700 text-sm md:text-base">
          <span class="w-7 h-7 bg-gray-200 rounded-full flex items-center justify-center font-bold">2</span>
          個人資料
        </div>
        <div onclick="goToStep(3)" id="step3" class="step px-7 py-3 rounded-2xl font-medium cursor-pointer flex items-center gap-2 text-gray-500 hover:text-gray-700 text-sm md:text-base">
          <span class="w-7 h-7 bg-gray-200 rounded-full flex items-center justify-center font-bold">3</span>
          確認提交
        </div>
      </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-8 p-6 md:p-8">
      <!-- Desktop Sidebar -->
      <div class="desktop-sidebar lg:w-96 bg-white rounded-3xl shadow-2xl p-6 h-fit sticky top-6">
        <h3 class="text-2xl font-bold text-gray-800 mb-5">📋 已選項目</h3>
        <div id="selectedList" class="space-y-4 min-h-[320px]"></div>
        <div class="border-t pt-6 mt-6">
          <div class="flex justify-between items-baseline text-2xl font-bold">
            <span class="text-gray-700">總金額</span>
            <span id="sidebarTotal" class="text-orange-600">HK$ 0</span>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="flex-1 main-content">
        <!-- Step 1 -->
        <div id="stepContent1">
          <h2 class="text-3xl font-bold mb-8 text-gray-800">🏅 選擇比賽項目</h2>
          <div id="eventList" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

          <!-- 下一步提示 -->
          <div class="mt-12 flex justify-end">
            <button onclick="goToStep(2)" class="gradient-btn text-white px-10 py-4 rounded-2xl font-bold text-lg shadow-lg">
              下一步：填寫個人資料 →
            </button>
          </div>
        </div>

        <!-- Step 2 -->
        <div id="stepContent2" class="hidden">
          <h2 class="text-3xl font-bold mb-8 text-gray-800">👤 填寫個人資料</h2>
          <div class="bg-white rounded-3xl shadow p-8 space-y-8 max-w-2xl">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">學員姓名 <span class="text-red-500">*</span></label>
              <input type="text" id="name" class="w-full px-6 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500 text-lg">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">聯絡電話 <span class="text-red-500">*</span></label>
              <input type="tel" id="phone" maxlength="8" class="w-full px-6 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500 text-lg">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">出生日期 <span class="text-red-500">*</span></label>
              <input type="date" id="birthdate" class="w-full px-6 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500 text-lg">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">所屬道場</label>
              <select id="dojo" class="w-full px-6 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500 text-lg">
                <option value="">請選擇道場</option>
                <option value="觀塘總館">觀塘總館</option>
                <option value="紅磡-培匠道場">紅磡-培匠道場</option>
                <option value="鰂魚涌體育館">鰂魚涌體育館</option>
                <option value="北角官立小學">北角官立小學</option>
                <option value="大角嘴天主教小學">大角嘴天主教小學</option>
                <option value="佛教林金殿紀念小學">佛教林金殿紀念小學</option>
                <option value="其他">其他</option>
              </select>
            </div>
          </div>

          <!-- 上一步 / 下一步 -->
          <div class="mt-10 flex justify-between max-w-2xl">
            <button onclick="goToStep(1)" class="px-8 py-4 bg-gray-200 rounded-2xl font-bold text-lg">
              ← 上一步
            </button>
            <button onclick="goToStep(3)" class="gradient-btn text-white px-10 py-4 rounded-2xl font-bold text-lg shadow-lg">
              下一步：確認報名 →
            </button>
          </div>
        </div>

        <!-- Step 3 -->
        <div id="stepContent3" class="hidden">
          <h2 class="text-3xl font-bold mb-8 text-gray-800">✅ 確認報名資料</h2>
          <div class="bg-white rounded-3xl shadow p-8">
            <div id="confirmPersonal" class="mb-10 space-y-2 text-lg"></div>
            <div id="confirmEvents" class="mb-10"></div>
            <div class="text-4xl font-bold text-center py-10 border-t border-dashed">
              總金額：<span id="finalTotal" class="text-orange-600">HK$ 0</span>
            </div>
            <button onclick="confirmSubmission()"
                    class="w-full py-5 gradient-btn text-white text-xl font-bold rounded-3xl mt-4">
              確認提交報名
            </button>
            <div class="mt-6 text-center">
              <button onclick="goToStep(2)" class="text-gray-500 underline text-sm">← 返回修改個人資料</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Bar（只有手機顯示，跟之前一樣） -->
  <div class="bottom-bar fixed bottom-0 left-0 right-0 bg-white border-t shadow-2xl z-50 p-4">
    <div onclick="showMobileSelectedModal()" class="flex items-center justify-between cursor-pointer w-full">
      <div class="flex items-center gap-3">
        <span class="text-2xl">📋</span>
        <div>
          <div class="font-bold text-lg">已選 <span id="mobileCount" class="text-orange-600">0</span> 個比賽</div>
          <div id="mobileTotal" class="text-orange-600 font-bold">HK$ 0</div>
        </div>
      </div>
      <button class="gradient-btn text-white px-8 py-3 rounded-2xl font-bold whitespace-nowrap">查看詳情</button>
    </div>
  </div>

  <!-- Category Modal -->
  <div id="categoryModal" class="modal">
    <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-lg w-full mx-4">
      <h2 id="categoryTitle" class="text-2xl font-bold mb-6"></h2>
      <div id="categoryGroup" class="max-h-[420px] overflow-y-auto space-y-3"></div>
      <div id="categorySum" class="mt-6 p-5 bg-blue-50 rounded-2xl text-lg font-semibold"></div>
      <div class="flex gap-4 mt-8">
        <button onclick="closeCategoryModal()" class="flex-1 py-4 bg-gray-200 rounded-2xl font-medium">取消</button>
        <button onclick="confirmCategorySelection()" class="flex-1 py-4 gradient-btn text-white rounded-2xl font-bold">確定</button>
      </div>
    </div>
  </div>

  <!-- Mobile Selected Modal -->
  <div id="mobileSelectedModal" class="modal">
    <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto">
      <h3 class="text-xl font-bold mb-6 sticky top-0 bg-white pb-4 border-b">已選比賽詳情</h3>
      <div id="mobileSelectedList" class="space-y-8"></div>
      <div class="text-2xl font-bold text-center py-6 border-t">總金額 <span id="mobileModalTotal" class="text-orange-600"></span></div>
      <button onclick="closeMobileSelectedModal()" class="w-full py-4 bg-gray-200 rounded-2xl mt-4">關閉</button>
    </div>
  </div>

  <!-- Thank You Page -->
  <div id="thankYouPage" class="hidden fixed inset-0 bg-gradient-to-br from-blue-50 to-white flex items-center justify-center z-[2000]">
    <div class="text-center px-6">
      <div class="text-8xl mb-6 animate-bounce">🏆</div>
      <h2 class="text-4xl font-bold mb-4">報名成功！</h2>
      <p class="text-xl text-gray-600 mb-10">教練將盡快與您聯繫確認</p>
      <button onclick="restartForm()" class="px-12 py-5 bg-gradient-to-r from-blue-600 to-orange-500 text-white rounded-3xl font-bold text-xl shadow-xl">
        再次報名
      </button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbweHCRt46_ljRxDdvvIqmW7ZJGli9zDxek8M1B2kRAFBypM6kV4_pFAgTNdT6OP5G0C/exec';

    let selectedCategories = {};
    let tempCategories = {};
    let eventCategories = {};
    let categoryPrices = {};
    let discountRules = {};
    let adminFees = {};
    let eventOrder = [];
    let eventDetails = {};
    let currentStep = 1;

    function cleanCategoryName(cat) {
      return cat.split(' - $')[0].trim();
    }
    function getOriginalCategoryName(cat) {
      return cat;
    }
    function formatPrice(price) {
      return Number.isInteger(price) ? price.toString() : price.toFixed(1).replace(/\.0$/, '');
    }

    function calculateDiscountedPrice(eventName, selected, calculateFormula = false) {
      if (!Array.isArray(selected) || selected.length === 0) return 0;
     
      let totalPrice = 0;
      let formulaParts = [];
      let hasDiscount = false;
      let discountedItems = new Set();
      let discountBreakdown = [];
      const adminFee = adminFees[eventName] || 0;
      const selectedClean = selected.map(cat => cleanCategoryName(cat));
      let remaining = [...selectedClean];
      const rules = discountRules[eventName] || [];

      rules.filter(r => r.type === "fixed").forEach(rule => {
        if (rule.condition.every(cat => selectedClean.includes(cat))) {
          totalPrice += rule.totalPrice;
          hasDiscount = true;
          rule.condition.forEach(cat => discountedItems.add(cat));
          discountBreakdown.push({ name: rule.condition.join(" + "), discount: rule.totalPrice });
          if (calculateFormula) formulaParts.push(`$${rule.totalPrice}`);
          remaining = remaining.filter(cat => !rule.condition.includes(cat));
        }
      });

      rules.filter(r => r.type === "group").forEach(rule => {
        const groupCats = rule.categories;
        const selectedInGroup = remaining.filter(cat => groupCats.includes(cat));
        const count = selectedInGroup.length;

        if (count >= 2) {
          const bestDiscount = rule.discounts
            .slice()
            .sort((a, b) => b.count - a.count)
            .find(d => count >= d.count);

          if (bestDiscount) {
            let finalPrice = 0;

            if (bestDiscount.rate !== undefined) {
              let originalSum = 0;
              selectedInGroup.forEach(cat => {
                originalSum += categoryPrices[`${eventName}:${cat}`] || 0;
              });
              finalPrice = Math.round(originalSum * bestDiscount.rate);
            } else {
              finalPrice = bestDiscount.totalPrice;
            }

            totalPrice += finalPrice;
            hasDiscount = true;
            selectedInGroup.forEach(cat => discountedItems.add(cat));
            discountBreakdown.push({
              name: `${rule.groupName} (${count}項)`,
              discount: finalPrice
            });
            if (calculateFormula) {
              formulaParts.push(`$${finalPrice} (${rule.groupName} - ${count}項)`);
            }
            remaining = remaining.filter(cat => !selectedInGroup.includes(cat));
          }
        }
      });

      remaining.forEach(cat => {
        const price = categoryPrices[`${eventName}:${cat}`] || 0;
        totalPrice += price;
        if (calculateFormula) formulaParts.push(`$${price}`);
      });

      totalPrice += adminFee;
      if (calculateFormula && adminFee > 0) formulaParts.push(`$${adminFee} (行政費)`);

      const formula = formulaParts.join(' + ');
      return calculateFormula
        ? { totalPrice, formula, hasDiscount, adminFee, discountedItems: Array.from(discountedItems), discountBreakdown }
        : totalPrice;
    }

    async function loadEvents() {
      try {
        const res = await fetch(`${WEB_APP_URL}?action=events`);
        const data = await res.json();

        if (!data.success) {
          console.error('載入比賽失敗:', data.error);
          alert('無法載入比賽資料，請稍後再試');
          return;
        }

        document.getElementById('eventList').innerHTML = '';
        eventOrder = [];
        eventCategories = {};
        categoryPrices = {};
        discountRules = {};
        adminFees = {};
        eventDetails = {};

        data.events.forEach(row => {
          const eventName = row.eventName;
          if (!eventName) return;

          eventOrder.push(eventName);

          eventDetails[eventName] = {
            date: row.date || '',
            location: row.location || '',
            items: row.items || '',
            target: row.target || '',
            deadline: row.deadline || '',
            notes: row.notes || ''
          };

          const cats = (row.categories || '').split(',').map(c => c.trim()).filter(Boolean);
          eventCategories[eventName] = cats;

          cats.forEach(cat => {
            const m = cat.match(/(.+?)\s*-\s*\$(\d+)/);
            if (m) {
              categoryPrices[`${eventName}:${m[1].trim()}`] = parseInt(m[2]);
            }
          });

          try {
            const d = JSON.parse(row.discountJson || '{}');
            adminFees[eventName] = d.adminFee || 0;
            discountRules[eventName] = [];

            if (d.groups) {
              d.groups.forEach(g => {
                discountRules[eventName].push({
                  type: "group",
                  groupName: g.name || "組合優惠",
                  categories: (g.categories || []).map(c => c.trim()),
                  discounts: g.discounts || []
                });
              });
            }
            if (d.discounts) {
              d.discounts.forEach(disc => {
                discountRules[eventName].push({
                  type: "fixed",
                  condition: (disc.condition || []).map(c => c.trim()),
                  totalPrice: disc.totalPrice
                });
              });
            }
          } catch (e) {
            console.warn('折扣規則解析失敗', eventName, e);
          }

          const card = document.createElement('div');
          card.className = `bg-white rounded-3xl shadow-xl p-6 card-hover cursor-pointer border-2 ${selectedCategories[eventName] ? 'border-orange-500 bg-orange-50' : 'border-transparent'}`;

          const formatText = (text) => text.replace(/\n/g, '<br>');

          card.innerHTML = `
            <h3 class="text-xl font-bold mb-2">${eventName}</h3>
            <p class="text-sm text-gray-600">${eventDetails[eventName].date}</p>
           
            <div class="info-content text-sm border-t pt-4 mt-4 space-y-3">
              ${eventDetails[eventName].location ? `<div class="flex"><span class="text-blue-600 font-medium w-16 flex-shrink-0">地點</span><span class="text-gray-700">${formatText(eventDetails[eventName].location)}</span></div>` : ''}
              ${eventDetails[eventName].items ? `<div class="flex"><span class="text-blue-600 font-medium w-16 flex-shrink-0">項目</span><span class="text-gray-700">${formatText(eventDetails[eventName].items)}</span></div>` : ''}
              ${eventDetails[eventName].target ? `<div class="flex"><span class="text-blue-600 font-medium w-16 flex-shrink-0">對象</span><span class="text-gray-700">${formatText(eventDetails[eventName].target)}</span></div>` : ''}
              ${eventDetails[eventName].deadline ? `<div class="flex"><span class="text-blue-600 font-medium w-16 flex-shrink-0">截止</span><span class="text-gray-700">${formatText(eventDetails[eventName].deadline)}</span></div>` : ''}
              ${eventDetails[eventName].notes ? `<div class="flex"><span class="text-blue-600 font-medium w-16 flex-shrink-0">備註</span><span class="text-gray-700">${formatText(eventDetails[eventName].notes)}</span></div>` : ''}
            </div>
            <button onclick="event.stopImmediatePropagation(); showCategoryModal('${eventName}');"
                    class="mt-6 w-full py-4 rounded-2xl font-semibold ${selectedCategories[eventName] ? 'bg-orange-500 text-white' : 'bg-blue-100 text-blue-700'}">
              ${selectedCategories[eventName] ? '已選擇 ✓ 修改' : '選擇項目'}
            </button>
          `;

          card.onclick = function(e) {
            if (e.target.tagName === 'BUTTON') return;
            this.classList.toggle('expanded');
          };

          document.getElementById('eventList').appendChild(card);
        });

        updateAllUI();
      } catch (err) {
        console.error('載入比賽資料失敗', err);
        alert('無法載入比賽資料，請檢查網路或稍後再試');
      }
    }

    function updateAllUI() {
      updateSidebar();
      updateMobileBottomBar();
    }

    function showCategoryModal(eventName) {
      tempCategories[eventName] = selectedCategories[eventName] ? [...selectedCategories[eventName]] : [];
      document.getElementById('categoryTitle').textContent = `${eventName} - 選擇項目`;
      const group = document.getElementById('categoryGroup');
      group.innerHTML = '';
      eventCategories[eventName].forEach(cat => {
        const checked = tempCategories[eventName].includes(cat) ? 'checked' : '';
        const label = document.createElement('label');
        label.className = "flex items-center gap-4 p-4 hover:bg-blue-50 rounded-2xl cursor-pointer";
        label.innerHTML = `<input type="checkbox" ${checked} class="w-6 h-6 accent-blue-600" onchange="updateTempCategories('${eventName}', '${cat}', this.checked)"> <span>${cat}</span>`;
        group.appendChild(label);
      });
      updateCategorySum(eventName);
      document.getElementById('categoryModal').style.display = 'flex';
    }

    function updateTempCategories(eventName, cat, checked) {
      if (!tempCategories[eventName]) tempCategories[eventName] = [];
      if (checked) {
        if (!tempCategories[eventName].includes(cat)) tempCategories[eventName].push(cat);
      } else {
        tempCategories[eventName] = tempCategories[eventName].filter(c => c !== cat);
      }
      updateCategorySum(eventName);
    }

    function updateCategorySum(eventName) {
      const el = document.getElementById('categorySum');
      if (!tempCategories[eventName]?.length) {
        el.innerHTML = '尚未選擇';
        return;
      }
      const { totalPrice, formula, hasDiscount } = calculateDiscountedPrice(eventName, tempCategories[eventName], true);
      el.innerHTML = `總金額 <strong>HK$ ${formatPrice(totalPrice)}</strong><br><small>${formula}</small>${hasDiscount ? '<small class="text-red-500">（已套用優惠）</small>' : ''}`;
    }

    function closeCategoryModal() {
      document.getElementById('categoryModal').style.display = 'none';
    }

    function confirmCategorySelection() {
      const eventName = document.getElementById('categoryTitle').textContent.split(' - ')[0];
      if (tempCategories[eventName]?.length) {
        selectedCategories[eventName] = [...tempCategories[eventName]];
      } else {
        delete selectedCategories[eventName];
      }
      closeCategoryModal();
      updateAllUI();
    }

    function deleteEvent(eventName) {
      delete selectedCategories[eventName];
      updateAllUI();
    }

    function updateSidebar() {
      let total = 0;
      let html = '';
      Object.keys(selectedCategories).forEach(event => {
        const price = calculateDiscountedPrice(event, selectedCategories[event]);
        total += price;
        html += `
          <div class="bg-white rounded-2xl p-5 shadow border">
            <div class="font-bold">${event}</div>
            <div class="text-sm text-gray-500">${selectedCategories[event].length} 個項目</div>
            <div class="flex justify-between mt-3">
              <span class="font-bold text-orange-600">HK$ ${formatPrice(price)}</span>
              <button onclick="deleteEvent('${event}')" class="text-red-500 text-sm">移除</button>
            </div>
          </div>`;
      });
      document.getElementById('selectedList').innerHTML = html || '<p class="text-gray-400 py-10 text-center">尚未選擇項目</p>';
      document.getElementById('sidebarTotal').textContent = `HK$ ${formatPrice(total)}`;
    }

    function updateMobileBottomBar() {
      let total = 0;
      Object.keys(selectedCategories).forEach(event => total += calculateDiscountedPrice(event, selectedCategories[event]));
      const count = Object.keys(selectedCategories).length;
      document.getElementById('mobileCount').textContent = count;
      document.getElementById('mobileTotal').textContent = `HK$ ${formatPrice(total)}`;
    }

    function showMobileSelectedModal() {
      let html = '';
      let total = 0;
      Object.keys(selectedCategories).forEach(event => {
        const cats = selectedCategories[event];
        const result = calculateDiscountedPrice(event, cats, true);
        const subtotal = result.totalPrice || 0;
        total += subtotal;

        let itemsHTML = cats.map(cat => {
          const cleanCat = cleanCategoryName(cat);
          const price = categoryPrices[`${event}:${cleanCat}`] || 0;
          const hasDiscount = result.discountedItems.includes(cleanCat);
          return `
            <div class="flex justify-between py-1.5">
              <span class="text-gray-700">${getOriginalCategoryName(cat)}</span>
              <span class="${hasDiscount ? 'line-through text-gray-400' : 'font-medium text-gray-800'}">
                HK$ ${formatPrice(price)}
              </span>
            </div>`;
        }).join('');

        if (adminFees[event] > 0) {
          itemsHTML += `
            <div class="flex justify-between py-1.5 text-gray-600">
              <span>行政費</span>
              <span class="font-medium">HK$ ${adminFees[event]}</span>
            </div>`;
        }

        let discountHTML = '';
        if (result.discountBreakdown && result.discountBreakdown.length > 0) {
          discountHTML = result.discountBreakdown.map(d => `
            <div class="flex justify-between py-1 text-red-600 text-sm">
              <span>• ${d.name} 優惠</span>
              <span>HK$ ${formatPrice(d.discount)}</span>
            </div>
          `).join('');
        }

        html += `
          <div class="p-5 bg-gray-50 rounded-3xl border">
            <div class="font-bold text-lg mb-4">${event}</div>
            <div class="mb-6">
              <div class="text-sm font-semibold text-gray-500 mb-3">已選擇項目</div>
              ${itemsHTML}
            </div>
            ${discountHTML ? `
            <div class="mb-6">
              <div class="text-sm font-semibold text-red-500 mb-3">優惠明細</div>
              ${discountHTML}
            </div>` : ''}
            <div class="flex justify-between items-center pt-4 border-t font-bold">
              <span>小計</span>
              <span class="text-orange-600">HK$ ${formatPrice(subtotal)}</span>
            </div>
          </div>`;
      });

      document.getElementById('mobileSelectedList').innerHTML = html || '<p class="text-center text-gray-400 py-8">尚未選擇項目</p>';
      document.getElementById('mobileModalTotal').textContent = `HK$ ${formatPrice(total)}`;
      document.getElementById('mobileSelectedModal').style.display = 'flex';
    }

    function closeMobileSelectedModal() {
      document.getElementById('mobileSelectedModal').style.display = 'none';
    }

    function goToStep(step) {
      if (step === 2) {
        if (Object.keys(selectedCategories).length === 0) {
          alert('請至少選擇一個比賽項目');
          return;
        }
      }
      if (step === 3) {
        if (!validatePersonalInfo()) return;
      }

      currentStep = step;

      document.querySelectorAll('#stepContent1, #stepContent2, #stepContent3').forEach(el => el.classList.add('hidden'));
      document.getElementById(`stepContent${step}`).classList.remove('hidden');

      for (let i = 1; i <= 3; i++) {
        const el = document.getElementById(`step${i}`);
        el.classList.toggle('step-active', i === step);
      }

      if (step === 3) renderConfirmPage();

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function validatePersonalInfo() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const birth = document.getElementById('birthdate').value;
      if (!name) { alert('請填寫學員姓名'); return false; }
      if (!phone || phone.length !== 8) { alert('請填寫正確的8位電話號碼'); return false; }
      if (!birth) { alert('請選擇出生日期'); return false; }
      return true;
    }

    function renderConfirmPage() {
      let personalHTML = `
        <p><strong>姓名：</strong> ${document.getElementById('name').value}</p>
        <p><strong>電話：</strong> ${document.getElementById('phone').value}</p>
        <p><strong>出生日期：</strong> ${document.getElementById('birthdate').value}</p>
        <p><strong>道場：</strong> ${document.getElementById('dojo').value || '未填寫'}</p>
      `;
      document.getElementById('confirmPersonal').innerHTML = personalHTML;

      let eventsHTML = '';
      let grandTotal = 0;

      Object.keys(selectedCategories).forEach(event => {
        const cats = selectedCategories[event];
        const result = calculateDiscountedPrice(event, cats, true);
        const subtotal = result.totalPrice || 0;
        grandTotal += subtotal;

        let itemsHTML = cats.map(cat => {
          const cleanCat = cleanCategoryName(cat);
          const price = categoryPrices[`${event}:${cleanCat}`] || 0;
          const hasDiscount = result.discountedItems.includes(cleanCat);
          return `
            <div class="flex justify-between py-1.5">
              <span class="text-gray-700">${getOriginalCategoryName(cat)}</span>
              <span class="${hasDiscount ? 'line-through text-gray-400' : 'font-medium text-gray-800'}">
                HK$ ${formatPrice(price)}
              </span>
            </div>`;
        }).join('');

        if (adminFees[event] > 0) {
          itemsHTML += `
            <div class="flex justify-between py-1.5 text-gray-600">
              <span>行政費</span>
              <span class="font-medium">HK$ ${adminFees[event]}</span>
            </div>`;
        }

        let discountHTML = '';
        if (result.discountBreakdown && result.discountBreakdown.length > 0) {
          discountHTML = result.discountBreakdown.map(d => `
            <div class="flex justify-between py-1 text-red-600 text-sm">
              <span>• ${d.name} 優惠</span>
              <span>HK$ ${formatPrice(d.discount)}</span>
            </div>
          `).join('');
        }

        eventsHTML += `
          <div class="mb-10 p-6 bg-gray-50 rounded-3xl border">
            <div class="font-bold text-lg mb-4">${event}</div>
            <div class="mb-6">
              <div class="text-sm font-semibold text-gray-500 mb-3">已選擇項目</div>
              ${itemsHTML}
            </div>
            ${discountHTML ? `
            <div class="mb-6">
              <div class="text-sm font-semibold text-red-500 mb-3">優惠明細</div>
              ${discountHTML}
            </div>` : ''}
            <div class="flex justify-between items-center pt-5 border-t border-gray-300 font-bold text-lg">
              <span>小計</span>
              <span class="text-orange-600">HK$ ${formatPrice(subtotal)}</span>
            </div>
          </div>`;
      });

      document.getElementById('confirmEvents').innerHTML = eventsHTML || '<p class="text-gray-400">尚未選擇項目</p>';
      document.getElementById('finalTotal').textContent = `HK$ ${formatPrice(grandTotal)}`;
    }

    async function confirmSubmission() {
      if (!validatePersonalInfo()) return;

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const birthdate = document.getElementById('birthdate').value;
      const dojo = document.getElementById('dojo').value;

      const events = Object.keys(selectedCategories);
      if (events.length === 0) {
        alert('請至少選擇一個比賽項目');
        return;
      }

      const eventsData = events.map(eventName => {
        const cats = selectedCategories[eventName];
        return {
          eventName: eventName,
          categories: cats.map(c => cleanCategoryName(c)),
          amount: calculateDiscountedPrice(eventName, cats)
        };
      });

      const payload = {
        name: name,
        phone: phone,
        birthdate: birthdate,
        dojo: dojo,
        events: eventsData,
        batchId: crypto.randomUUID()
      };

      const btn = document.querySelector('#stepContent3 button');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '提交中...';
      }

      try {
        const res = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (result.success) {
          document.getElementById('thankYouPage').classList.remove('hidden');
        } else {
          alert('提交失敗：' + (result.error || '未知錯誤'));
          if (btn) {
            btn.disabled = false;
            btn.textContent = '確認提交報名';
          }
        }
      } catch (err) {
        console.error(err);
        alert('網路錯誤，請稍後再試');
        if (btn) {
          btn.disabled = false;
          btn.textContent = '確認提交報名';
        }
      }
    }

    function restartForm() {
      location.reload();
    }

    window.onload = () => {
      loadEvents();
      goToStep(1);
    };
  </script>
</body>
</html>
